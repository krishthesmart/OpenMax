# Minimal SearXNG config for OpenMax: JSON output enabled, limiter off (it is bound to localhost only).
use_default_settings: true
general:
  instance_name: "OpenMax search"
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  # CHANGE THIS before exposing the container to anything but localhost.
  secret_key: "change-me-openmax-searxng"
  limiter: false
  image_proxy: false
ui:
  static_use_hash: true
